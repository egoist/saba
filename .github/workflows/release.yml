name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make release VERSION=${GITHUB_REF_NAME}
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum saba-* > checksums.txt
          gh release create "$GITHUB_REF_NAME" saba-* checksums.txt --generate-notes
